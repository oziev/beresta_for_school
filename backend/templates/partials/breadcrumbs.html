{% if breadcrumbs %}
<nav aria-label="Хлебные крошки" class="mb-6">
  <ol class="flex flex-wrap items-center gap-1 text-sm">
    {% for crumb in breadcrumbs %}
      <li class="flex items-center gap-1">
        {% if not loop.first %}
          <span class="text-stone-300 select-none">→</span>
        {% endif %}
        {% if crumb.current %}
          <span class="font-semibold text-green-700">{{ crumb.label }}</span>
        {% elif crumb.href %}
          <a href="{{ crumb.href }}" class="text-stone-500 hover:text-green-700 transition">{{ crumb.label }}</a>
        {% else %}
          <span class="text-stone-400">{{ crumb.label }}</span>
        {% endif %}
      </li>
    {% endfor %}
  </ol>
</nav>
{% endif %}
